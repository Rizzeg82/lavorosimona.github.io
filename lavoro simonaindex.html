<script>
const INF=Infinity,$=s=>document.querySelector(s);
const r=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,pick=a=>a[r(0,a.length-1)],shuf=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const f=n=>n<0?'−'+(-n):''+n,flip=o=>({'<':'>','>':'<','≤':'≥','≥':'≤'})[o];
const cmp=(a,o,b)=>o=='<'?a<b:o=='>'?a>b:o=='≤'?a<=b:a>=b;
const from=(o,s)=>o=='>'?{a:s,ai:0,b:INF,bi:0}:o=='≥'?{a:s,ai:1,b:INF,bi:0}:o=='<'?{a:-INF,ai:0,b:s,bi:0}:{a:-INF,ai:0,b:s,bi:1};
const emp=v=>v.a>v.b||(v.a==v.b&&!(v.ai&&v.bi));
function inter(p,q){let a,ai,b,bi;if(p.a==q.a){a=p.a;ai=p.ai&&q.ai}else if(p.a>q.a){a=p.a;ai=p.ai}else{a=q.a;ai=q.ai}
if(p.b==q.b){b=p.b;bi=p.bi&&q.bi}else if(p.b<q.b){b=p.b;bi=p.bi}else{b=q.b;bi=q.bi}return{a,ai,b,bi}}
const eq=(p,q)=>(emp(p)&&emp(q))||(!emp(p)&&!emp(q)&&p.a==q.a&&p.b==q.b&&(p.a==-INF||!!p.ai==!!q.ai)&&(p.b==INF||!!p.bi==!!q.bi));
const has=(v,x)=>!emp(v)&&(x>v.a||(v.ai&&x==v.a))&&(x<v.b||(v.bi&&x==v.b));
function txt(v){if(emp(v))return'∅ (nessuna soluzione)';if(v.a==v.b)return'x = '+f(v.a);
if(v.a==-INF)return'x '+(v.bi?'≤':'<')+' '+f(v.b);if(v.b==INF)return'x '+(v.ai?'≥':'>')+' '+f(v.a);
return f(v.a)+' '+(v.ai?'≤':'<')+' x '+(v.bi?'≤':'<')+' '+f(v.b)}
const ints=v=>{let o=[];for(let x=-40;x<=40;x++)if(has(v,x))o.push(x);return o};
const lin=(k,m)=>(k==1?'':k==-1?'−':f(k))+'x'+(m?(m>0?' + '+m:' − '+(-m)):'');
function raw(k,m,op,n){const s=(n-m)/k;return{k,m,op,n,txt:lin(k,m)+' '+op+' '+f(n),iv:from(k<0?flip(op):op,s),s,ok:x=>cmp(k*x+m,op,n)}}
const mk=(k,m,op,s)=>raw(k,m,op,k*s+m);
function cons(kind,s,inc,neg){const o2=kind=='lo'?(inc?'≥':'>'):(inc?'≤':'<'),k=neg?pick([-1,-2,-3]):pick([1,2,3]);return mk(k,r(-4,4),neg?flip(o2):o2,s)}
const sysH=a=>`<div class="sys"><i>{</i><div>${a.map(x=>x.txt||x).join('<br>')}</div></div>`;
const hs=(a,b)=>sysH([a,b]);
function nl(rows,o={}){const lo=o.lo??-10,hi=o.hi??10,sm=o.sm,W=sm?300:680,pad=sm?14:30,st=(W-2*pad)/(hi-lo),X=v=>pad+(v-lo)*st,rh=sm?30:46,H=rows.length*rh+(sm?26:36),ay=H-(sm?18:26);
let s=`<svg viewBox="0 0 ${W} ${H}" class="nl" role="img" aria-label="retta dei numeri">`;
rows.forEach((w,i)=>{const y=rh*i+rh*.62,v=w.v;if(w.label&&!sm)s+=`<text x="${pad}" y="${y-13}" fill="${w.c}" font-weight="bold" font-size="15">${w.label}</text>`;
if(!emp(v)){const xa=v.a==-INF?0:X(Math.max(v.a,lo)),xb=v.b==INF?W:X(Math.min(v.b,hi));
s+=`<line x1="${xa}" x2="${xb}" y1="${y}" y2="${y}" stroke="${w.c}" stroke-width="${sm?6:9}" stroke-linecap="round"/>`;
[[v.a,v.ai],[v.b,v.bi]].forEach(([t,inc])=>{if(isFinite(t))s+=`<circle cx="${X(t)}" cy="${y}" r="${sm?6:10}" fill="${inc?w.c:'#fff'}" stroke="${w.c}" stroke-width="3"/>`})}});
s+=`<line x1="0" x2="${W}" y1="${ay}" y2="${ay}" stroke="#444" stroke-width="2"/>`;
for(let t=lo;t<=hi;t++){s+=`<line x1="${X(t)}" x2="${X(t)}" y1="${ay-5}" y2="${ay+5}" stroke="#444"/>`;if(!sm||t%5==0)s+=`<text x="${X(t)}" y="${ay+(sm?17:21)}" text-anchor="middle" font-size="${sm?11:13}">${f(t)}</text>`}
return s+'</svg>'}
const C1='#e07a5f',C2='#3d85c6',C3='#4caf7a',C4='#9b6fc7';
function distr(v){const o=[],add=x=>{if(!emp(x)&&!eq(x,v)&&!o.some(y=>eq(x,y)))o.push(x)};
if(isFinite(v.a)){add({...v,ai:!v.ai});add({...v,a:v.a+1});add({...v,a:v.a-1})}
if(isFinite(v.b)){add({...v,bi:!v.bi});add({...v,b:v.b+1});add({...v,b:v.b-1})}
if(v.a==-INF)add(from(v.bi?'≥':'>',v.b));else if(v.b==INF)add(from(v.ai?'≤':'<',v.a));else add({a:-v.b,ai:v.bi,b:-v.a,bi:v.ai});
return shuf(o)}
const ivOpts=v=>shuf([[txt(v),1],...distr(v).slice(0,3).map(x=>[txt(x),0])]).map(([h,ok])=>({h,ok}));
function randIv(i){const t=r(0,2)&&i>=2?'seg':'ray';if(t=='ray')return from(pick(['<','>','≤','≥']),r(-7,7));const a=r(-8,3);return{a,ai:r(0,1),b:a+r(2,7),bi:r(0,1)}}
function twoRays(cls){for(let t=0;t<999;t++){const p=from(pick(['<','>','≤','≥']),r(-7,7)),q=from(pick(['<','>','≤','≥']),r(-7,7)),I=inter(p,q);
const c=emp(I)?'vuoto':(I.a==-INF||I.b==INF)?'semiretta':'finito';if(!cls||c==cls)return{p,q,I,c}}}
function steps(q){const s=q.s,k=q.k;return`1) Sposto il numero ${f(q.m)} dall’altra parte e cambio il suo segno: ${lin(k,0)} ${q.op} ${f(q.n-q.m)}.<br>2) Divido per ${f(k)}`+(k<0?' (è <b>negativo</b>: il segno <b>si gira</b>!)':' (è positivo: il segno resta uguale)')+`.<br>3) Risultato: <b>${txt(q.iv)}</b>`}
function mc(p,vis,o,why,help,extra){return{t:'mc',p,vis:vis||'',o,why:why||'',help:help||'',...extra}}
const SIG={'x':'x = incognita, cioè il numero che cerchiamo','ℝ':'ℝ = insieme dei numeri reali, cioè tutti i numeri della retta (anche quelli con la virgola)','○':'○ = pallino vuoto: il numero NON è incluso','●':'● = pallino pieno: il numero è incluso',
'≤':'≤ = minore o uguale; ≥ = maggiore o uguale','∅':'∅ = insieme vuoto: significa «nessuna soluzione»','C.E.':'C.E. = Condizioni di Esistenza (i numeri che x non può avere, per esempio quando x è in una frazione sotto la linea)','LIM':'LIM = Lavagna Interattiva Multimediale','V/F':'V/F = Vero o Falso','es.':'es. = esempio','sis.':'sistema = più disequazioni scritte insieme'};
const sigDesc=a=>a.map(k=>SIG[k]).join(' · ');
const STS=[['Vero','Falso'],
['Dividendo per un numero negativo, il segno della disequazione si gira.',1,'Esatto: &lt; diventa &gt; e ≤ diventa ≥.'],
['Il pallino pieno si usa con i segni &lt; e &gt;.',0,'No: con &lt; e &gt; si usa il pallino <b>vuoto</b>. Il pieno si usa con ≤ e ≥.'],
['In x ≥ 3 il numero 3 va bene.',1,'Sì: ≥ vuol dire «maggiore <b>o uguale</b>», quindi 3 è incluso.'],
['Il pallino vuoto significa che il numero è incluso.',0,'No: pallino vuoto = numero escluso.'],
['Se divido per 2 il segno si gira.',0,'No: 2 è positivo. Il segno si gira solo con i numeri negativi.'],
['In un sistema si cerca la parte comune a tutte le disequazioni.',1,'Giusto: la soluzione è l’intersezione, cioè la parte comune.'],
['Il sistema x &gt; 5 e x &lt; 2 ha soluzioni.',0,'No: nessun numero è più grande di 5 e più piccolo di 2. Il sistema è impossibile: ∅.'],
['La soluzione di una disequazione di solito è un solo numero.',0,'No: di solito sono <b>tanti</b> numeri (un intervallo o una semiretta).']];
const ERR=[
{l:['−2x &lt; 6','Divido per −2','x &lt; −3'],e:2,w:'Dividendo per un numero negativo il segno si gira: la soluzione giusta è <b>x &gt; −3</b>.'},
{l:['2x − 1 ≥ 5','2x ≥ 5 + 1','x ≥ 3'],e:-1,w:'È tutto giusto! Hai fatto bene a non trovare errori.'},
{l:['Sistema: x &gt; 2 e x &lt; 6','Disegno x &lt; 6 con il pallino pieno ●','Soluzione: 2 &lt; x &lt; 6'],e:1,w:'Con &lt; il pallino deve essere <b>vuoto</b> ○ (il 6 non è incluso).'},
{l:['Sistema: x &gt; 1 e x &lt; 4','Disegno le due linee','Soluzione: tutti i numeri delle due linee (unione)'],e:2,w:'Nel sistema serve la <b>parte comune</b> (intersezione), non l’unione: <b>1 &lt; x &lt; 4</b>.'},
{l:['3x + 2 ≤ 11','3x ≤ 11 + 2','x ≤ 13/3'],e:1,w:'Sposto +2 e cambio il segno: 3x ≤ 11 <b>−</b> 2, cioè 3x ≤ 9, quindi x ≤ 3.'},
{l:['−x ≥ 1','Moltiplico per −1','x ≥ −1'],e:2,w:'Moltiplicando per −1 il segno si gira: <b>x ≤ −1</b>.'},
{l:['4 − x &gt; 1','−x &gt; 1 − 4  →  −x &gt; −3','Cambio il segno e giro il verso: x &lt; 3'],e:-1,w:'Tutto giusto! Il segno si gira perché cambio segno a x.'}];
const G=[
{id:1,l:1,n:'Pallino giusto',e:'⚪',d:'Pallino vuoto o pieno?',rules:'Leggi la disequazione. Il numero è incluso? Scegli il pallino giusto.',sig:['○','●','≤','x'],N:6,
gen:i=>{const o=pick(['<','>','≤','≥']),s=r(-6,6),inc=o=='≤'||o=='≥';return mc(`Nella disequazione <b>x ${o.replace('<','&lt;').replace('>','&gt;')} ${f(s)}</b>, che pallino metto sul ${f(s)}?`,'',
[{h:'○ Pallino vuoto (il numero NON va bene)',ok:!inc},{h:'● Pallino pieno (il numero va bene)',ok:inc}],inc?`Il segno ${o} comprende anche «uguale»: il ${f(s)} va bene, pallino <b>pieno</b>.`:`Il segno ${o} non comprende «uguale»: il ${f(s)} non va bene, pallino <b>vuoto</b>.`,'',{vis:nl([{v:from(o,s),c:C1}])})}},
{id:2,l:1,n:'Leggi il disegno',e:'👀',d:'Dalla retta alla disequazione',rules:'Guarda la parte colorata sulla retta reale (ℝ). Scegli la disequazione giusta.',sig:['ℝ','x','○','●'],N:6,
gen:i=>{const v=i<3?from(pick(['<','>','≤','≥']),r(-7,7)):randIv(i);return mc('Quale disequazione descrive la parte colorata?',nl([{v,c:C2}]),ivOpts(v),`Pallino ${'vuoto ○ = escluso, pieno ● = incluso'}. La soluzione è <b>${txt(v)}</b>.`)}},
{id:3,l:1,n:'Quale numero va bene?',e:'🔢',d:'Provo i numeri',rules:'Un solo numero rende vera la disequazione. Trovalo!',sig:['x'],N:6,
gen:i=>{const q=i<3?mk(1,0,pick(['<','>','≤','≥']),r(-5,5)):mk(pick([2,3]),pick([-3,-2,1,2,4]),pick(['<','>','≤','≥']),r(-4,4));
const g=[],b=[];for(let x=-10;x<=10;x++)(q.ok(x)?g:b).push(x);const c=pick(g),w=shuf(b).slice(0,3);
return mc(`Quale numero rende vera <b>${q.txt.replace('<','&lt;').replace('>','&gt;')}</b> ?`,'',shuf([c,...w]).map(x=>({h:f(x),ok:x==c})),`Provo ${f(c)}: ${q.k==1?f(c):f(q.k)+'·'+(c<0?'('+f(c)+')':c)}${q.m?(q.m>0?' + '+q.m:' − '+(-q.m)):''} = ${f(q.k*c+q.m)}, e ${f(q.k*c+q.m)} ${q.op} ${f(q.n)} è vero.`)}},
{id:4,l:1,n:'Tiro al bersaglio',e:'🎯',d:'Scrivi la disequazione',rules:'Il bersaglio è la parte arancione. Costruisci la disequazione con i menu: la tua risposta (blu) deve coprire il bersaglio, senza sforare.',sig:['x','ℝ','○','●'],N:5,
gen:i=>({t:'comp',iv:i<2?from(pick(['<','>','≤','≥']),r(-7,7)):randIv(3),sunk:[]})},
{id:5,l:1,n:'Vero o Falso: le regole',e:'✅',d:'Regole da ricordare',rules:'Leggi la frase. È vera o falsa? (V/F = Vero o Falso)',sig:['V/F','○','●','∅'],N:8,
gen:i=>{const s=STS[i+1];return mc(s[0],'',[{h:'✅ Vero',ok:s[1]==1},{h:'❌ Falso',ok:s[1]==0}],s[2])}},
{id:6,l:2,n:'Risolvi e scegli',e:'🧮',d:'Risolvo una disequazione',rules:'Risolvi la disequazione (puoi chiedere aiuto!). Quando dividi per un numero negativo, il segno si gira.',sig:['x'],N:6,
gen:i=>{const neg=i>=3,q=mk(neg?pick([-1,-2,-3]):pick([2,3,4]),pick([-4,-3,-2,2,3,5]),pick(['<','>','≤','≥']),r(-5,5));
return mc(`Risolvi: <b>${q.txt.replace('<','&lt;').replace('>','&gt;')}</b>`,'',ivOpts(q.iv),steps(q),steps(q))}},
{id:7,l:2,n:'Indovina il numero',e:'🕵️',d:'Chi è l’intruso?',rules:'Penso a un numero intero tra −10 e 10. Gli indizi sono disequazioni. I numeri che non vanno più bene si spengono. Tocca il numero segreto!',sig:['x'],N:4,
gen:i=>{const n=r(-9,9);let cl=[];const al=()=>{const a=[];for(let x=-10;x<=10;x++)if(cl.every(c=>c.ok(x)))a.push(x);return a};
while(al().length>1&&cl.length<8){const j=cl.length,k=pick([1,2,-1,-2,3]),d=r(0,Math.max(0,3-j));let o2=j%2?pick(['<','≤']):pick(['>','≥']);if(d==0&&j>=2)o2=j%2?'≤':'≥';
const s=o2=='>'?n-Math.max(d,1):o2=='≥'?n-d:o2=='<'?n+Math.max(d,1):n+d;cl.push(mk(k,pick([-3,-1,0,2,3]),k<0?flip(o2):o2,s))}return{t:'guess',n,cl,seen:1}}},
{id:8,l:2,n:'Battaglia navale',e:'🚢',d:'Affonda le navi',rules:'Le navi sono segmenti o semirette sulla retta reale (ℝ) da −10 a 10. Per colpirne una scrivi la disequazione esatta: né più grande né più piccola.',sig:['ℝ','x','○','●'],N:4,
gen:i=>{const sh=[{a:-9,ai:1,b:-4,bi:0},from('≥',5),{a:-2,ai:0,b:3,bi:1},{a:-5,ai:1,b:-5+r(2,4),bi:1}];const iv=i==3?{a:r(-6,0),ai:r(0,1),b:r(2,8),bi:r(0,1)}:sh[i];return{t:'comp',iv,sunk:sh.slice(0,i).map(v=>v),ship:1}}},
{id:9,l:2,n:'La parte comune',e:'🤝',d:'Dove si incontrano?',rules:'Due condizioni insieme (sistema). Quale parte della retta va bene per tutte e due? Cerca dove le due linee si sovrappongono.',sig:['sis.','∅','ℝ'],N:6,
gen:i=>{const {p,q,I}=twoRays(i<4?r(0,1)?'finito':'semiretta':null);const t=txt(I);const alt=[txt(p),txt(q),...distr(emp(I)?p:I).map(txt)];const o=[t,...[...new Set(alt)].filter(x=>x!=t).slice(0,3)];
return mc('Quale è la <b>parte comune</b> delle due linee?',nl([{v:p,c:C2,label:'1ª condizione'},{v:q,c:C3,label:'2ª condizione'}]),shuf(o).map(h=>({h,ok:h==t})),`La parte comune è dove ci sono <b>tutte e due</b> le linee: <b>${t}</b>.`,'',{})}},
{id:10,l:2,n:'Semaforo logico',e:'🚦',d:'Finito, semiretta o ∅?',rules:'Guarda il sistema già disegnato. La soluzione è un intervallo finito, una semiretta, oppure nessuna soluzione (∅)? Puoi giocare senza tempo.',sig:['∅','sis.','ℝ'],N:6,timer:1,

[{h:'🟢 Intervallo finito',ok:c=='finito'},{h:'🟡 Semiretta',ok:c=='semiretta'},{h:'🔴 Impossibile (∅)',ok:c=='vuoto'}],`La soluzione è <b>${txt(I)}</b>: ${c=='finito'?'un intervallo con due estremi.':c=='semiretta'?'una semiretta, cioè una linea che continua senza fine.':'le linee non si toccano, il sistema è impossibile.'}`)}},
{id:11,l:3,n:'Domino dei sistemi',e:'🁢',d:'Abbina sistema e grafico',rules:'Ogni tessera ha un sistema a sinistra e il suo grafico a destra. Trova il grafico giusto per chiudere la catena.',sig:['sis.','○','●','ℝ'],N:5,

[1,2,3].map(l=>`<h2>${L[l-1][1]}</h2><div class="grid">${G.filter(g=>g.l==l).map(g=>`<button class="card L${l}" onclick="play(${g.id})"><b>${g.e} ${g.id}. ${g.n}</b><span>${g.d}</span><div>${'⭐'.repeat(st[g.id]||0)||'☆☆☆'}</div></button>`).join('')}</div>`).join('')}
